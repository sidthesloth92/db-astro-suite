<div class="upload-overlay">
  <div class="upload-card">
    <label for="imageUpload" class="upload-trigger">
      <span class="upload-glyph" aria-hidden="true">↑</span>
      <span class="upload-title">Upload Target</span>
      <span class="upload-hint">Choose a background image</span>
    </label>
    <input
      type="file"
      id="imageUpload"
      class="upload-input"
      accept="image/*"
      (change)="handleImageUpload($event)"
    />
    <p class="upload-system-hint">System Ready: Select visual data</p>
  </div>
</div>
