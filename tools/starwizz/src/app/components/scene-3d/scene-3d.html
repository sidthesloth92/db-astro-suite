<!-- `star-canvas` is the class the end-to-end tests mask in screenshots, for both renderers. -->
<canvas
  #sceneCanvas
  class="star-canvas scene-canvas"
  [class.aiming]="scene3d.isAiming()"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp()"
  (pointercancel)="onPointerUp()"
  (lostpointercapture)="onPointerUp()"
></canvas>

@if (scene3d.isAiming()) {
  <button
    type="button"
    class="aim-marker"
    [attr.aria-label]="aimLabel()"
    [style.left.%]="aimLeft()"
    [style.top.%]="aimTop()"
    (keydown)="onAimKey($event)"
  ></button>
}

@if (scene3d.visibleError(); as message) {
  <p class="scene-error" role="alert">{{ message }}</p>
}
