<section class="control-panel" aria-label="Starwizz simulation controls">
  <header class="panel-header">
    <h2 class="panel-title">System Controls</h2>
    <span class="panel-status">STATUS: ACTIVE</span>
  </header>

  <div class="panel-row">
    <span class="row-label">Background Image</span>
    <div class="upload-cluster">
      <dba-ui-icon-button
        title="Upload background image"
        accent="pink"
        [size]="36"
        (clicked)="uploadInputEl.click()"
      >
        <dba-ui-icon [def]="uploadIcon" [size]="16" />
      </dba-ui-icon-button>
      <span class="upload-hint">Choose a background image</span>
    </div>
    <input
      #uploadInputEl
      type="file"
      class="sr-only"
      accept="image/*"
      (change)="onUploadInput($event)"
    />
  </div>

  <dba-ui-select
    label="Aspect Ratio"
    [value]="simService.currentAspectRatio()"
    [options]="ratioOptions"
    (valueChange)="updateAspectRatio($event)"
  ></dba-ui-select>

  @for (control of controlNames; track control) {
    <div class="slider-row">
      <label class="row-label">{{ controlConfig[control].label }}</label>
      <dba-ui-micro-slider
        [value]="getControlValue(control)"
        [min]="controlConfig[control].min"
        [max]="controlConfig[control].max"
        [step]="controlConfig[control].step"
        (valueChange)="updateControlValue(control, $event)"
      ></dba-ui-micro-slider>
    </div>
  }

  <div class="panel-actions">
    <dba-ui-text-button
      label="Reset Animation"
      variant="secondary"
      size="sm"
      [disabled]="!simService.isImageLoaded() || simService.recordingState() !== 'idle'"
      (clicked)="restartAnimation()"
    >
      <dba-ui-icon slot="leading" [def]="rotateCcwIcon" [size]="12" />
    </dba-ui-text-button>
    <dba-ui-text-button
      label="Reset Params"
      variant="secondary"
      size="sm"
      [disabled]="simService.recordingState() !== 'idle'"
      (clicked)="resetParams()"
    >
      <dba-ui-icon slot="leading" [def]="rotateCcwIcon" [size]="12" />
    </dba-ui-text-button>
  </div>

  <div class="record-row">
    <button
      type="button"
      class="record-button"
      [attr.data-state]="recordingState()"
      [disabled]="isRecordDisabled()"
      title="Record up to 30 seconds of the animation as a video file"
      (click)="toggleRecording()"
    >
      {{ buttonText() }}
    </button>

    <div class="record-aux">
      <dba-ui-switch
        ariaLabel="Record from beginning"
        [checked]="simService.recordFromBeginning()"
        [disabled]="simService.recordingState() !== 'idle'"
        (checkedChange)="simService.recordFromBeginning.set($event)"
      ></dba-ui-switch>
      <span class="record-aux-label">From beginning</span>
    </div>
  </div>
</section>
