<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Celestory — Stats</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #141925; --panel2: #1b2230; --line: #283041;
    --fg: #e6ebf5; --muted: #8b97ad; --accent: #7aa2ff; --accent2: #b58cff;
    --good: #6fe0a0; --warn: #ffcf6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    padding: 22px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  h1 { font-size: 20px; margin: 0; letter-spacing: .3px; }
  h1 .dim { color: var(--muted); font-weight: 400; }
  .controls { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  select, button, label.file {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; font-size: 14px; cursor: pointer;
  }
  select { min-width: 220px; }
  button:hover, label.file:hover { border-color: var(--accent); }
  main { padding: 24px; max-width: 1100px; margin: 0 auto; }
  .drop {
    margin: 40px auto; max-width: 560px; text-align: center; padding: 48px 24px;
    border: 2px dashed var(--line); border-radius: 16px; color: var(--muted);
  }
  .drop.drag { border-color: var(--accent); color: var(--fg); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
  }
  .card .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
  .card .v { font-size: 24px; font-weight: 650; margin-top: 4px; }
  .card .v small { font-size: 14px; color: var(--muted); font-weight: 400; }
  section { margin-top: 28px; }
  section h2 { font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin: 0 0 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 12px; font-size: 13px;
  }
  .chip b { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); font-size: 14px; }
  th { color: var(--muted); font-weight: 500; }
  tr:hover td { background: var(--panel); }
  .bar { height: 8px; border-radius: 6px; background: var(--accent); }
  .bartrack { background: var(--panel2); border-radius: 6px; overflow: hidden; min-width: 80px; }
  .dups { color: var(--warn); }
  .muted { color: var(--muted); }
  .pill { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
  a { color: var(--accent); }
  code { background: var(--panel2); padding: 1px 6px; border-radius: 5px; }
</style>
</head>
<body>
<header>
  <h1>Celestory <span class="dim">— imaging stats</span></h1>
  <div class="controls">
    <select id="picker" hidden></select>
    <label class="file">Load ledger<input id="file" type="file" accept="application/json,.json" hidden></label>
    <button id="download" hidden>Download JSON</button>
  </div>
</header>
<main>
  <div id="drop" class="drop">
    <p><strong>Drop your <code>ledger.json</code> here</strong></p>
    <p>or use “Load ledger”. Everything stays in your browser — nothing is uploaded.</p>
  </div>
  <div id="content"></div>
</main>

<script>
  window.__LEDGER__ = /*__CELESTORY_DATA__*/null;

  var ledger = null;

  function fmtDur(sec) {
    sec = Math.max(0, Math.round(sec || 0));
    var h = Math.floor(sec / 3600);
    var m = Math.round((sec % 3600) / 60);
    if (h === 0 && m === 0 && sec > 0) return "<1m";
    return h + "h " + m + "m";
  }
  function fmtBytes(b) {
    b = b || 0;
    var u = ["B", "KB", "MB", "GB", "TB"], i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return b.toFixed(b < 10 && i > 0 ? 1 : 0) + " " + u[i];
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function el(html) { var d = document.createElement("div"); d.innerHTML = html; return d.firstElementChild; }

  function equipMap(L) {
    var m = {};
    (L.equipment || []).forEach(function (e) { m[e.id] = e.displayName; });
    return m;
  }

  function card(k, v, sub) {
    return '<div class="card"><div class="k">' + esc(k) + '</div><div class="v">' +
      v + (sub ? ' <small>' + esc(sub) + '</small>' : '') + '</div></div>';
  }

  function filterBars(filters, maxSec) {
    if (!filters || !filters.length) return '<span class="muted">—</span>';
    return '<table>' + filters.map(function (f) {
      var pct = maxSec > 0 ? Math.round((f.seconds / maxSec) * 100) : 0;
      return '<tr><td style="width:90px">' + esc(f.name) + '</td>' +
        '<td><div class="bartrack"><div class="bar" style="width:' + pct + '%"></div></div></td>' +
        '<td style="width:90px;text-align:right">' + fmtDur(f.seconds) +
        (f.frames != null ? ' <span class="pill">' + f.frames + '</span>' : '') + '</td></tr>';
    }).join('') + '</table>';
  }

  function renderOverall(L) {
    var s = L.summary || {};
    var maxF = (s.filters || []).reduce(function (a, f) { return Math.max(a, f.seconds); }, 0);
    var html = '';
    html += '<div class="cards">' +
      card("Total integration", fmtDur(s.totalIntegrationSeconds)) +
      card("Objects", s.objectCount || 0) +
      card("Nights imaged", s.nightCount || 0) +
      card("Light frames", (s.lightFrameCount || 0).toLocaleString()) +
      card("First light", esc(s.firstLight || "—")) +
      card("Latest session", esc(s.latestSession || "—")) +
      '</div>';

    if (s.duplicateFileCount > 0) {
      html += '<section><h2>Duplicates</h2><p class="dups">⚠ ' + s.duplicateFileCount +
        ' duplicate file(s) found at other paths — about ' + fmtBytes(s.duplicateWastedBytes) +
        ' redundant. They are counted once. See <code>ledger.json → duplicates</code>.</p></section>';
    }

    if ((s.byCategory || []).length) {
      html += '<section><h2>By category</h2><div class="chips">' +
        s.byCategory.map(function (c) {
          return '<span class="chip"><b>' + esc(c.category) + '</b> · ' + c.objectCount +
            ' · ' + fmtDur(c.integrationSeconds) + '</span>';
        }).join('') + '</div></section>';
    }

    html += '<section><h2>Filters</h2>' + filterBars(s.filters, maxF) + '</section>';

    if ((L.equipment || []).length) {
      html += '<section><h2>Equipment</h2><table><tr><th>Gear</th><th>Kind</th><th>Objects</th><th style="text-align:right">Integration</th></tr>' +
        L.equipment.map(function (e) {
          return '<tr><td>' + esc(e.displayName) + '</td><td class="muted">' + esc(e.kind) +
            '</td><td>' + (e.objectCount || 0) + '</td><td style="text-align:right">' +
            fmtDur(e.totalIntegrationSeconds) + '</td></tr>';
        }).join('') + '</table></section>';
    }
    return html;
  }

  function renderObject(L, obj) {
    var em = equipMap(L);
    var maxF = (obj.filters || []).reduce(function (a, f) { return Math.max(a, f.seconds); }, 0);
    var typeLine = [obj.designation, obj.type, obj.category].filter(Boolean).map(esc).join(" · ");
    var gear = (obj.equipmentIds || []).map(function (id) { return esc(em[id] || id); }).join(", ") || "—";

    var html = '<h2 style="font-size:22px;color:var(--fg);text-transform:none;letter-spacing:0;margin:4px 0 2px">' +
      esc(obj.displayName) + '</h2><p class="muted">' + typeLine + '</p>';

    html += '<div class="cards">' +
      card("Integration", fmtDur(obj.totalIntegrationSeconds)) +
      card("Nights imaged", obj.nightCount || 0) +
      card("Light frames", (obj.lightFrameCount || 0).toLocaleString()) +
      card("First light", esc(obj.firstLight || "—")) +
      card("Latest session", esc(obj.latestSession || "—")) +
      '</div>';

    html += '<section><h2>Filters</h2>' + filterBars(obj.filters, maxF) + '</section>';
    html += '<section><h2>Equipment</h2><p>' + gear + '</p>';
    if ((obj.aliases || []).length) html += '<p class="muted">Also known as: ' + obj.aliases.map(esc).join(", ") + '</p>';
    html += '</section>';

    html += '<section><h2>Timeline</h2><table><tr><th>Night</th><th>Integration</th><th>Frames</th><th>Filters</th><th>Gear</th></tr>' +
      (obj.sessions || []).map(function (ss) {
        var fl = (ss.filters || []).map(function (f) { return esc(f.name); }).join(", ");
        var g = ss.equipment ? esc([ss.equipment.camera, ss.equipment.telescope].filter(Boolean).join(" · ")) : "";
        return '<tr><td>' + esc(ss.date || "Undated") + '</td><td>' + fmtDur(ss.integrationSeconds) +
          '</td><td>' + (ss.frames || 0) + '</td><td>' + (fl || "—") + '</td><td class="muted">' + (g || "—") + '</td></tr>';
      }).join('') + '</table></section>';
    return html;
  }

  function populatePicker(L) {
    var sel = document.getElementById("picker");
    sel.innerHTML = "";
    var o0 = document.createElement("option");
    o0.value = "__overall__"; o0.textContent = "📊 Overall statistics";
    sel.appendChild(o0);
    (L.objects || []).forEach(function (obj) {
      var o = document.createElement("option");
      o.value = obj.id;
      o.textContent = obj.displayName + " · " + fmtDur(obj.totalIntegrationSeconds);
      sel.appendChild(o);
    });
    sel.hidden = false;
    sel.onchange = function () { renderSelection(L, sel.value); };
  }

  function renderSelection(L, value) {
    var content = document.getElementById("content");
    if (value === "__overall__" || !value) { content.innerHTML = renderOverall(L); return; }
    var obj = (L.objects || []).find(function (o) { return o.id === value; });
    content.innerHTML = obj ? renderObject(L, obj) : renderOverall(L);
  }

  function load(L) {
    if (!L || typeof L !== "object") return;
    ledger = L;
    document.getElementById("drop").hidden = true;
    document.getElementById("download").hidden = false;
    populatePicker(L);
    renderSelection(L, "__overall__");
  }

  function loadText(text) {
    try { load(JSON.parse(text)); }
    catch (e) { alert("That doesn't look like a valid Celestory JSON file."); }
  }

  // Download button
  document.getElementById("download").onclick = function () {
    if (!ledger) return;
    var blob = new Blob([JSON.stringify(ledger, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "ledger.json"; a.click();
    URL.revokeObjectURL(a.href);
  };

  // File input
  document.getElementById("file").addEventListener("change", function (e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader(); r.onload = function () { loadText(r.result); }; r.readAsText(f);
  });

  // Drag and drop
  var drop = document.getElementById("drop");
  ["dragenter", "dragover"].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("drag"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("drag"); });
  });
  document.addEventListener("drop", function (e) {
    var f = e.dataTransfer.files[0]; if (!f) return;
    var r = new FileReader(); r.onload = function () { loadText(r.result); }; r.readAsText(f);
  });

  // Boot: inline data → served ledger.json → drag-drop
  if (window.__LEDGER__) {
    load(window.__LEDGER__);
  } else {
    fetch("./ledger.json").then(function (r) { return r.ok ? r.text() : Promise.reject(); })
      .then(loadText).catch(function () { /* show drop zone */ });
  }
</script>
</body>
</html>
