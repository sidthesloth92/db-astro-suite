<div class="sb">
  <dba-constellation class="sb-deco" [seed]="seed()" />
  <div class="sb-eyebrow">
    <span class="sb-num">{{ num() }}</span>
    <span class="sb-line"></span>
    {{ eyebrow() }}
  </div>
  <div class="sb-titlerow">
    <span class="sb-glyph"><dba-cel-icon [name]="glyph()" [size]="28" /></span>
    <h2 class="sb-title">{{ title() }}</h2>
  </div>
  @if (sub()) {
    <div class="sb-sub">{{ sub() }}</div>
  }
</div>
