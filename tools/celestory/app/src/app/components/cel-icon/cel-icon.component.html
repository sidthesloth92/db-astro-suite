<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.7"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  @switch (name()) {
    @case ('galaxy') {
      <circle cx="12" cy="12" r="2" />
      <path d="M12 4c4 0 8 3 8 8M12 20c-4 0-8-3-8-8" />
    }
    @case ('camera') {
      <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7H7l1.2-1.8A1 1 0 0 1 9 4.7h6a1 1 0 0 1 .8.5L17 7h2.5A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z" />
      <circle cx="12" cy="12.5" r="3.3" />
    }
    @case ('optic') {
      <circle cx="12" cy="12" r="8.5" />
      <circle cx="12" cy="12" r="3.4" />
      <path d="M12 3.5v3M12 17.5v3M3.5 12h3M17.5 12h3" />
    }
    @case ('chart') {
      <path d="M4 20V6M10 20V4M16 20v-8M20 20H3.5" />
    }
    @case ('star') {
      <path d="M12 4l2.2 5.3L20 10l-4 3.8 1 5.6-5-2.8-5 2.8 1-5.6L4 10l5.8-.7z" />
    }
    @case ('back') {
      <path d="M15 5l-7 7 7 7" />
    }
    @case ('arrow') {
      <path d="M9 5l7 7-7 7" />
    }
    @case ('share') {
      <circle cx="6" cy="12" r="2.4" />
      <circle cx="17" cy="6" r="2.4" />
      <circle cx="17" cy="18" r="2.4" />
      <path d="M8.1 10.9l6.8-3.8M8.1 13.1l6.8 3.8" />
    }
    @case ('globe') {
      <circle cx="12" cy="12" r="8.5" />
      <path d="M3.5 12h17M12 3.5c2.5 2.4 2.5 14.6 0 17M12 3.5c-2.5 2.4-2.5 14.6 0 17" />
    }
    @case ('lock') {
      <rect x="5" y="11" width="14" height="9" rx="2" />
      <path d="M8 11V8a4 4 0 0 1 8 0v3" />
    }
    @case ('eye') {
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" />
      <circle cx="12" cy="12" r="2.6" />
    }
    @case ('link') {
      <path d="M9 15l6-6" />
      <path d="M10.5 7.5 12 6a3.5 3.5 0 0 1 5 5l-1.5 1.5" />
      <path d="M13.5 16.5 12 18a3.5 3.5 0 0 1-5-5l1.5-1.5" />
    }
    @case ('check') {
      <path d="M5 12.5l4.5 4.5L19 7" />
    }
    @case ('upload') {
      <path d="M12 15V4M12 4 8 8M12 4l4 4" />
      <path d="M4 14v3a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-3" />
    }
    @case ('image') {
      <rect x="3" y="4" width="18" height="16" rx="2" />
      <circle cx="8.5" cy="9.5" r="1.6" />
      <path d="M4 18l5-5 4 3.5 3-2.5 4 4" />
    }
    @case ('download') {
      <path d="M12 4v11M8 11l4 4 4-4" />
      <path d="M4 17v1a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-1" />
    }
    @case ('rocket') {
      <path d="M12 3c3 1.5 5 5 5 9l-2.5 2.5h-5L7 12c0-4 2-7.5 5-9z" />
      <circle cx="12" cy="9.5" r="1.6" />
      <path d="M9.5 16.5 7 20M14.5 16.5 17 20" />
    }
    @case ('key') {
      <circle cx="8" cy="15" r="3.5" />
      <path d="M10.4 12.6 20 3M16.5 6.5l2.5 2.5M14.5 8.5l2 2" />
    }
    @case ('trash') {
      <path d="M4 7h16M9.5 7V5.2A1.2 1.2 0 0 1 10.7 4h2.6a1.2 1.2 0 0 1 1.2 1.2V7" />
      <path d="M6.5 7l.9 12.1A1.4 1.4 0 0 0 8.8 20.4h6.4a1.4 1.4 0 0 0 1.4-1.3L17.5 7" />
      <path d="M10 11v5.5M14 11v5.5" />
    }
    @case ('copy') {
      <rect x="9" y="9" width="11" height="11" rx="2" />
      <path d="M5 15V5a2 2 0 0 1 2-2h8" />
    }
    @case ('terminal') {
      <rect x="3" y="4" width="18" height="16" rx="2" />
      <path d="M7 9l3 3-3 3M12.5 15h4" />
    }
    @case ('edit') {
      <path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17z" />
      <path d="M13.5 8.5l3 3" />
    }
  }
</svg>
