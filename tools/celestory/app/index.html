<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Celestory — Chart your journey under the stars</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Point Celestory at your astrophotography light frames and get a gallery-grade chronicle of your imaging journey — every target, every filter, every photon, across every year — rendered entirely in your browser. Nothing is uploaded."
    />
    <meta name="theme-color" content="#05060A" />
    <!-- Static crawler-fallback social tags; per-page SSR overrides title/desc/image. -->
    <meta property="og:site_name" content="Celestory" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Team fonts: Orbitron + Outfit ship locally via @db-astro-suite/theme;
         Fira Code (mono) is the suite's monospace, linked here like the hub.
         IBM Plex Mono is the share-card label font (matches the design source).
         Fraunces + JetBrains Mono remain for the preview/portfolio pages. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Google tag (gtag.js) — skipped on localhost so dev traffic never reaches the prod GA4 property.
         Re-enable locally with ?analytics=on (one session) or localStorage 'ga-debug'='on' (persistent). -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      (function () {
        var host = location.hostname;
        var isLocal =
          host === 'localhost' || host === '127.0.0.1' || host.endsWith('.local');

        // Local opt-in override: ?analytics=on forces it on for this load and
        // remembers the choice; ?analytics=off clears it. A persisted 'ga-debug'
        // flag keeps GA on across reloads until explicitly turned off.
        var override = null;
        try {
          var qp = new URLSearchParams(location.search).get('analytics');
          if (qp === 'on') {
            localStorage.setItem('ga-debug', 'on');
            override = true;
          } else if (qp === 'off') {
            localStorage.removeItem('ga-debug');
            override = false;
          } else if (localStorage.getItem('ga-debug') === 'on') {
            override = true;
          }
        } catch (e) {
          /* storage unavailable (private mode) — fall back to host check */
        }

        var enabled = override === null ? !isLocal : override;
        if (!enabled) {
          return; // analytics disabled
        }

        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-SBXMGWP56E';
        document.head.appendChild(s);
        gtag('js', new Date());
        // page_view is fired manually by RouteAnalyticsTracker on every router NavigationEnd
        gtag('config', 'G-SBXMGWP56E', { send_page_view: false });
      })();
    </script>
  </head>
  <body>
    <dba-celestory-root></dba-celestory-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
