        <h1>AstroSpike — Add Diffraction Spikes to Astrophotography Images</h1>
        <p>
          AstroSpike is a free web tool for astrophotographers. Upload an astrophoto and
          AstroSpike detects the stars automatically, then renders realistic diffraction
          spikes on them — the classic four-point Newtonian look, the six-point JWST
          signature, or a spike-free diffusion bloom — before exporting as JPEG or PNG.
        </p>

          <li>High-quality JPEG and PNG export, plus a spikes-only transparent PNG layer</li>
          <li>100% client-side processing — your image never leaves your browser</li>
        </ul>
        <h2>Who is it for?</h2>
