<dba-ui-header
  title="ASTROSPIKE"
  titleAccent="SPIKE"
  [version]="version"
  tagline="Diffraction spike studio"
  logoSrc="assets/img/astrospike-mark.svg"
  logoLink="/tool/astrospike"
></dba-ui-header>

<!-- Title-bar action. It sits over the header rather than inside the pane
     because it concerns the whole studio, and because the pane is gone
     entirely before an image is loaded. Reset is NOT here: it lives on the
     canvas tool rail, where the work being thrown away is. -->
@if (!breakpoints.isMobile()) {
  <div class="as-titlebar-actions">
    <dba-ui-text-button
      label="How to use"
      variant="secondary"
      accent="cyan"
      size="sm"
      (clicked)="onOpenHowTo()"
    />
  </div>
}

@if (breakpoints.isMobile()) {
  <main class="as-container as-container--mobile">
    <dba-as-spike-stage></dba-as-spike-stage>

    <dba-ui-icon-button
      class="as-mobile-howto"
      accent="cyan"
      [size]="44"
      title="How to use"
      (clicked)="onOpenHowTo()"
    >
      <dba-ui-icon [def]="circleHelpIcon" [size]="18" />
    </dba-ui-icon-button>

    @if (!sheetExpanded()) {
      <dba-ui-icon-button
        class="as-mobile-fab"
        accent="cyan"
        [size]="52"
        title="Open controls"
        (clicked)="toggleSheet()"
      >
        <dba-ui-icon [def]="slidersIcon" [size]="24" />
      </dba-ui-icon-button>
    }

    <dba-ui-floating-sheet
      class="as-mobile-sheet"
      [class.as-mobile-sheet--ghosted]="isAdjusting()"
      [(expanded)]="sheetExpanded"
      title="Controls"
      [maxHeightPercent]="62"
      (pointerdown)="onAdjustStart($event)"
      (pointerup)="onAdjustEnd()"
      (pointercancel)="onAdjustEnd()"
    >
      <dba-as-control-panel class="in-sheet"></dba-as-control-panel>
    </dba-ui-floating-sheet>
  </main>
} @else {
  <main class="as-container">
    <dba-as-spike-stage></dba-as-spike-stage>
    <!-- No image, no inspector: the stage takes the whole width rather than
         sitting beside a pane whose every control would act on nothing. -->
    @if (hasInspector()) {
      <dba-as-control-panel></dba-as-control-panel>
    }
  </main>
}

@if (isHowToOpen()) {
  <dba-as-how-to-overlay (closed)="onCloseHowTo()" />
}
