<section class="side-panel" aria-label="AstroSpike controls">
  <header class="side-panel__header">
    <h2 class="side-panel__title">Controls</h2>
  </header>

  @if (editor.imageMeta(); as meta) {
    <div class="side-panel__meta">
      <span class="side-panel__file" [title]="meta.fileName">{{ meta.fileName }}</span>
      <span class="side-panel__dims">{{ meta.width }}×{{ meta.height }} px</span>
    </div>
    <p class="side-panel__stars">{{ starSummary() }}</p>
  } @else {
    <p class="side-panel__empty">Load an image to begin.</p>
  }

  <div class="side-panel__actions">
    <dba-ui-text-button
      [label]="exportLabel()"
      [disabled]="isExportDisabled()"
      (clicked)="onExport()"
    >
      <span slot="leading" class="side-panel__export-spinner">
        @if (editor.isExporting()) {
          <dba-ui-constellation-loader [size]="16" />
        }
      </span>
    </dba-ui-text-button>

    @if (editor.exportError(); as error) {
      <p class="side-panel__error" role="alert">{{ error }}</p>
    }

    @if (editor.hasImage()) {
      <dba-ui-text-button
        label="New image"
        variant="secondary"
        size="sm"
        (clicked)="onClearImage()"
      />
    }
  </div>
</section>
