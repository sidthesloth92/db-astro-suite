<div class="preset-list" role="radiogroup" aria-label="Spike preset">
  @for (preset of presets; track preset.id) {
    <button
      type="button"
      role="radio"
      class="preset-card"
      [class.is-active]="preset.id === activeId()"
      [attr.aria-checked]="preset.id === activeId()"
      (click)="presetSelected.emit(preset.id)"
    >
      <span class="preset-glyph" aria-hidden="true">
        @if (preset.spikeCount === 6) {
          <svg viewBox="0 0 24 24">
            <path d="M12 2.5V21.5" />
            <path d="M3.8 7.25 20.2 16.75" />
            <path d="M3.8 16.75 20.2 7.25" />
            <circle cx="12" cy="12" r="1.6" />
          </svg>
        } @else {
          <!-- Four arms are rendered at a 45° offset, so the glyph is an X. -->
          <svg viewBox="0 0 24 24">
            <path d="M5.3 5.3 18.7 18.7" />
            <path d="M5.3 18.7 18.7 5.3" />
            <circle cx="12" cy="12" r="1.6" />
          </svg>
        }
      </span>

      <span class="preset-meta">
        <span class="preset-label">{{ preset.label }}</span>
        <span class="preset-description">{{ preset.description }}</span>
      </span>

      <span class="preset-arms">{{ preset.spikeCount }} arms</span>
    </button>
  }
</div>
