<section class="star-controls" [attr.aria-label]="starLabel() + ' spike controls'">
  <header class="star-controls__head">
    <span class="star-controls__title">{{ starLabel() }}</span>
    <dba-ui-icon-button title="Close star controls" [size]="24" (clicked)="onClose()">
      <dba-ui-icon [def]="closeIcon" [size]="12" />
    </dba-ui-icon-button>
  </header>

  <p class="star-controls__hint">Ringed on the canvas. These stack on the sliders below.</p>

  <div class="slider-row">
    <div class="slider-label-row">
      <label class="row-label">Length</label>
      <span class="row-value">{{ adjustment().lengthFactor }}×</span>
    </div>
    <dba-ui-micro-slider
      [value]="adjustment().lengthFactor"
      [min]="lengthMin"
      [max]="lengthMax"
      [step]="factorStep"
      [showReadout]="false"
      (valueChange)="onLengthChange($event)"
    ></dba-ui-micro-slider>
  </div>

  <div class="slider-row">
    <div class="slider-label-row">
      <label class="row-label">Brightness</label>
      <span class="row-value">{{ adjustment().intensityFactor }}×</span>
    </div>
    <dba-ui-micro-slider
      [value]="adjustment().intensityFactor"
      [min]="intensityMin"
      [max]="intensityMax"
      [step]="factorStep"
      [showReadout]="false"
      (valueChange)="onIntensityChange($event)"
    ></dba-ui-micro-slider>
  </div>

  <div class="slider-row">
    <div class="slider-label-row">
      <label class="row-label">Rotation</label>
      <span class="row-value">{{ adjustment().rotationDeg }}°</span>
    </div>
    <dba-ui-micro-slider
      [value]="adjustment().rotationDeg"
      [min]="rotationMin"
      [max]="rotationMax"
      [step]="rotationStep"
      [showReadout]="false"
      (valueChange)="onRotationChange($event)"
    ></dba-ui-micro-slider>
  </div>

  <div class="star-controls__actions">
    <button type="button" class="star-action" [disabled]="!isAdjusted()" (click)="onReset()">
      Reset
    </button>
    <button
      type="button"
      class="star-action"
      [class.star-action--danger]="isSpiked()"
      (click)="onToggleSpikes()"
    >
      {{ isSpiked() ? 'Remove spikes' : 'Add spikes' }}
    </button>
  </div>
</section>
