<div class="stage" (dragover)="onStageDragOver($event)" (drop)="onStageDrop($event)">
  <div
    class="stage-frame"
    [class.is-hidden]="!editor.hasImage()"
    [style.--as-frame-aspect]="frameAspect()"
  >
    <canvas #beforeCanvas class="stage-canvas before-canvas"></canvas>
    <canvas
      #afterCanvas
      class="stage-canvas after-canvas"
      [style.clip-path]="afterClipPath()"
    ></canvas>
    <canvas
      #markerCanvas
      class="stage-canvas marker-canvas"
      [class.is-over-star]="isOverStar()"
      [class.is-panning]="isPanning()"
      (pointerdown)="onStagePointerDown($event)"
      (pointermove)="onStagePointerMove($event)"
      (pointerup)="onStagePointerUp($event)"
      (pointercancel)="onStagePointerUp($event)"
      (pointerleave)="onStagePointerLeave()"
      (wheel)="onStageWheel($event)"
      (dblclick)="onStageDoubleClick()"
    ></canvas>

    @if (showCompareHandle()) {
      <dba-as-compare-handle
        [position]="editor.comparePosition()"
        (positionChange)="onComparePositionChange($event)"
      />
    }
  </div>

  @if (showDropzone()) {
    <dba-as-image-dropzone (imageSelected)="onFileSelected($event)" />
  }

  @if (isProcessing()) {
    <div class="stage-overlay" role="status" aria-live="polite">
      <div class="stage-loader" aria-hidden="true">
        <dba-ui-constellation-loader [fill]="true" />
      </div>
      <p class="stage-status">{{ statusLine() }}</p>
    </div>
  }

  @if (stageError(); as error) {
    <div class="stage-error" role="alert">
      <p class="stage-error__message">{{ error }}</p>
      <dba-ui-text-button
        label="Try another image"
        variant="secondary"
        size="sm"
        (clicked)="onTryAnother()"
      />
    </div>
  }

  @if (showStarPill()) {
    <dba-ui-pill-badge class="star-pill" tone="cyan">
      {{ editor.allStars().length }} stars detected
    </dba-ui-pill-badge>
  }
</div>
