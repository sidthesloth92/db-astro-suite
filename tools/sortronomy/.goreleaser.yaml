version: 2

project_name: sortronomy

before:
  hooks:
    - go mod tidy

builds:
  - id: sortronomy
    main: .
    binary: sortronomy
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{.ShortCommit}}"

homebrew_casks:
  - name: sortronomy
    repository:
      owner: sidthesloth92
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/sidthesloth92/db-astro-suite/tree/main/tools/sortronomy"
    description: "Organize astrophotography FITS files by camera, target, date, and filter — from headers."
    binaries:
      - sortronomy

scoops:
  - name: sortronomy
    repository:
      owner: sidthesloth92
      name: scoop-bucket
      token: "{{ .Env.SCOOP_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/sidthesloth92/db-astro-suite/tree/main/tools/sortronomy"
    description: "Organize astrophotography FITS files by camera, target, date, and filter — from headers."
    license: "MIT"

release:
  github:
    owner: sidthesloth92
    name: db-astro-suite
  name_template: "sortronomy {{.Version}}"
  prerelease: auto
