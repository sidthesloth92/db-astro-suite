version: 2

project_name: sortronomy

before:
  hooks:
    - go mod tidy

builds:
  - id: sortronomy
    main: .
    binary: sortronomy
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{.ShortCommit}}"

homebrew_casks:
  - name: sortronomy
    repository:
      owner: sidthesloth92
      name: homebrew-tap
      token: "{{ .Env.RELEASE_PAT }}"
    homepage: "https://github.com/sidthesloth92/db-astro-suite/tree/main/tools/sortronomy"
    description: "Organize astrophotography FITS files by camera, target, date, and filter — from headers."
    binaries:
      - sortronomy

scoops:
  - name: sortronomy
    repository:
      owner: sidthesloth92
      name: scoop-bucket
      token: "{{ .Env.RELEASE_PAT }}"
    homepage: "https://github.com/sidthesloth92/db-astro-suite/tree/main/tools/sortronomy"
    description: "Organize astrophotography FITS files by camera, target, date, and filter — from headers."
    license: "MIT"

winget:
  - name: sortronomy
    publisher: sidthesloth92
    package_identifier: sidthesloth92.Sortronomy
    short_description: "Organize astrophotography FITS files by camera, target, date, and filter — from headers."
    license: MIT
    homepage: "https://github.com/sidthesloth92/db-astro-suite/tree/main/tools/sortronomy"
    author: sidthesloth92
    publisher_url: "https://dbastrosuite.com"
    tags:
      - astrophotography
      - fits
      - astronomy
      - cli
    repository:
      owner: sidthesloth92
      name: winget-pkgs
      branch: "sortronomy-{{ .Version }}"
      token: "{{ .Env.RELEASE_PAT }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

release:
  github:
    owner: sidthesloth92
    name: db-astro-suite
  name_template: "sortronomy {{.Version}}"
  prerelease: auto
