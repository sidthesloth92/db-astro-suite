<div class="desktop" data-testid="desktop-shell">
  <dba-ag-top-bar />
  <div class="body">
    <main class="preview-col">
      <div class="preview-inner">
        <dba-ui-preview-context-bar [dimensions]="dimensions()" [currentZoom]="100" />
        <div class="preview-stage">
          @if (activeMode() === 'infographic') {
            <dba-ag-card-preview />
            <dba-ag-caption-section />
          } @else {
            <dba-ag-stellar-map-preview />
          }
        </div>
      </div>
    </main>
    <aside class="inspector-col">
      <dba-ag-inspector-panel-host />
    </aside>
  </div>
</div>
