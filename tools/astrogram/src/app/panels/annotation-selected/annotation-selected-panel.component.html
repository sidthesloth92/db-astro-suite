<div class="panel-root">
  @if (annotation()) {
    <dba-ui-inspector-section title="Identity" sub="Per-annotation overrides" [compact]="true">
      <dba-ui-icon slot="icon" [def]="targetIcon" [size]="14" />
      <dba-ui-inspector-field label="Label">
        <input
          class="label-input"
          type="text"
          [value]="effectiveLabel()"
          (input)="onLabelInput($event)"
          aria-label="Annotation label"
        />
      </dba-ui-inspector-field>
      <dba-ui-inspector-field label="Size">
        <dba-ui-micro-slider
          [value]="effectiveRadius()"
          [min]="4"
          [max]="maxRadius()"
          [step]="1"
          suffix="px"
          (valueChange)="updateStyle({ radiusOverride: $event })"
        />
      </dba-ui-inspector-field>
    </dba-ui-inspector-section>

    <hr class="divider" aria-hidden="true" />

    <dba-ui-inspector-section title="Circle" sub="Annotation ring">
      <dba-ui-icon slot="icon" [def]="targetIcon" [size]="14" />
      <dba-ui-inspector-field label="Color">
        <dba-ui-color-swatch-input
          [value]="effectiveColor()"
          (valueChange)="updateStyle({ color: $event })"
        />
      </dba-ui-inspector-field>
      <dba-ui-inspector-field label="Thickness">
        <dba-ui-micro-slider
          [value]="effectiveThickness()"
          [min]="1"
          [max]="10"
          [step]="0.5"
          (valueChange)="updateStyle({ thickness: $event })"
        />
      </dba-ui-inspector-field>
      <dba-ui-inspector-field label="Opacity">
        <dba-ui-micro-slider
          [value]="circleOpacityPercent()"
          [min]="0"
          [max]="100"
          [step]="5"
          suffix="%"
          (valueChange)="setCircleOpacity($event)"
        />
      </dba-ui-inspector-field>
    </dba-ui-inspector-section>

    <hr class="divider" aria-hidden="true" />

    <dba-ui-inspector-section title="Label" sub="Text plate">
      <dba-ui-icon slot="icon" [def]="tagIcon" [size]="14" />
      <dba-ui-inspector-field label="Color">
        <dba-ui-color-swatch-input
          [value]="effectiveLabelColor()"
          (valueChange)="updateStyle({ labelColor: $event })"
        />
      </dba-ui-inspector-field>
      <dba-ui-inspector-field label="Font size">
        <dba-ui-micro-slider
          [value]="effectiveFontSize()"
          [min]="0.4"
          [max]="2"
          [step]="0.05"
          (valueChange)="updateStyle({ fontSize: $event })"
        />
      </dba-ui-inspector-field>
      <dba-ui-inspector-field label="Opacity">
        <dba-ui-micro-slider
          [value]="labelOpacityPercent()"
          [min]="0"
          [max]="100"
          [step]="5"
          suffix="%"
          (valueChange)="setLabelOpacity($event)"
        />
      </dba-ui-inspector-field>
      <dba-ui-inspector-field label="Show mag">
        <dba-ui-switch
          [checked]="effectiveShowMagnitude()"
          ariaLabel="Show magnitude"
          (checkedChange)="updateStyle({ showMagnitude: $event })"
        />
      </dba-ui-inspector-field>
    </dba-ui-inspector-section>
  } @else {
    <div class="empty">
      <div class="empty-title">No annotation selected</div>
      <div class="empty-sub">Click any annotation on the preview to edit it here.</div>
    </div>
  }
</div>
