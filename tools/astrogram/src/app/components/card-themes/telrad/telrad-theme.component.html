@let data = vm();

<div class="tr-root" [class.tr-root--landscape]="isLandscapeFormat()" [class.tr-root--dense]="rows().length > 4">
  <dba-ag-theme-starfield [density]="90" [opacity]="0.3" [color]="cardData().secondaryAccentColor" [seed]="25" />

  <!-- Header -->
  <div class="tr-header">
    <span class="tr-eyebrow">Finder</span>
    <span class="tr-status">
      <span class="tr-status-dot"></span>
      Night vision
    </span>
  </div>

  <!-- Reticle -->
  <svg class="tr-svg" viewBox="0 0 476 412" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <!-- rings -->
    @for (ring of reticleRings; track ring.r) {
      <circle
        [attr.cx]="cx"
        [attr.cy]="cy"
        [attr.r]="ring.r"
        fill="none"
        class="tr-reticle-stroke"
        [attr.stroke-width]="ring.strokeWidth"
        [attr.opacity]="ring.opacity"
      />
      <text [attr.x]="ring.labelX" [attr.y]="ring.labelY" class="tr-ring-label">{{ ring.label }}</text>
    }

    <!-- crosshair ticks -->
    @for (tick of crosshairTicks; track $index) {
      <line [attr.x1]="tick.x1" [attr.y1]="tick.y1" [attr.x2]="tick.x2" [attr.y2]="tick.y2" class="tr-reticle-stroke" stroke-width="1.2" opacity="0.7" />
    }

    <!-- band dots -->
    @for (dot of reticleDots(); track $index) {
      <circle [attr.cx]="dot.x" [attr.cy]="dot.y" [attr.r]="dot.glowR" class="tr-reticle-fill" opacity="0.12" />
      <circle [attr.cx]="dot.x" [attr.cy]="dot.y" [attr.r]="dot.dotR" fill="#0A0202" class="tr-mark-stroke" stroke-width="1.6" />
      <circle [attr.cx]="dot.x" [attr.cy]="dot.y" [attr.r]="dot.coreR" class="tr-mark-fill" />
    }

    <!-- centre object marker -->
    <line [attr.x1]="cx - 10" [attr.y1]="cy" [attr.x2]="cx + 10" [attr.y2]="cy" stroke="#FFD9D2" stroke-width="1" opacity="0.9" />
    <line [attr.x1]="cx" [attr.y1]="cy - 10" [attr.x2]="cx" [attr.y2]="cy + 10" stroke="#FFD9D2" stroke-width="1" opacity="0.9" />
  </svg>

  <!-- Band readout -->
  <div class="tr-readout">
    @for (row of rows(); track row.id) {
      <div class="tr-row">
        <span class="tr-row-id">{{ row.id }}</span>
        <span class="tr-row-ring">RING {{ row.ringLabel }}</span>
        <div class="tr-row-bar">
          <div class="tr-row-fill" [style.width]="row.pctWidth"></div>
        </div>
        <span class="tr-row-time">{{ row.time }}</span>
        <span class="tr-row-frames">{{ row.frames }}</span>
      </div>
    }
  </div>

  <!-- Title + total -->
  <div class="tr-title" data-testid="card-hero">
    <div class="tr-title-main">
      <div class="tr-kicker">Target · {{ data.objectId }}</div>
      <div class="tr-name">{{ data.objectName }}</div>
    </div>
    <div class="tr-title-spacer"></div>
    <div class="tr-total">
      <div class="tr-total-label">Total</div>
      <div class="tr-total-value">{{ data.total }}</div>
    </div>
  </div>

  <div class="tr-spacer"></div>

  <!-- Footer -->
  <div class="tr-footer">
    <dba-ag-theme-gear-line class="tr-foot-gear" [values]="equipmentValues()" />
    <div class="tr-foot-row">
      <span class="tr-foot-author">{{ data.author }}</span>
      <span class="tr-foot-spacer"></span>
      <span class="tr-foot-meta">{{ footMeta() }}</span>
    </div>
  </div>
</div>
