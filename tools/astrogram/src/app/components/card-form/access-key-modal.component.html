<div class="modal-backdrop" (click)="onCancel()">
  <div class="modal-dialog" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2 class="modal-title">🔑 ASTROSOLVE ACCESS</h2>
    </div>

    <div class="modal-body">
      <p class="modal-description">An access key is required to use the Astrosolve service.</p>

      @if (showError()) {
        <p class="modal-error">Invalid access key — please try again</p>
      }

      <dba-ui-input
        label="Access Key"
        placeholder="Enter your access key..."
        type="password"
        [value]="keyValue()"
        (valueChange)="onKeyChange($event)"
      ></dba-ui-input>
    </div>

    <div class="modal-footer">
      <button class="modal-btn modal-btn--cancel" type="button" (click)="onCancel()">
        CANCEL
      </button>
      <button
        class="modal-btn modal-btn--submit"
        type="button"
        [disabled]="isSubmitDisabled()"
        (click)="onSubmit()"
      >
        SUBMIT
      </button>
    </div>
  </div>
</div>
