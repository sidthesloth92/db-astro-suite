<div class="preview-wrapper" #cardWrapper>
  <!-- Header: Lives outside the scaled container so it never shrinks -->
  <div class="post-header">
    @if (author()) {
      <div class="user-meta">
        <div class="avatar-mini"></div>
        <span class="username-top">{{ author() }}</span>
      </div>
    }
    <div class="header-actions">
      <ng-content select="[headerAction]"></ng-content>
      @if (!hideDownload()) {
        <dba-ui-icon-button
          title="Download card"
          [size]="36"
          [disabled]="isExporting()"
          (clicked)="exportCard()"
        >
          <dba-ui-icon [def]="downloadIcon" [size]="18" />
        </dba-ui-icon-button>
      }
    </div>
  </div>

  <!-- Scale Host: Manages the virtual space taken by the scaled content -->
  <div class="post-scale-host">
    @if (isExporting()) {
      <div class="export-overlay">
        <div class="export-spinner"></div>
        <span class="export-label">GENERATING...</span>
      </div>
    }
    <div class="post-container db-glass-panel" #postContainer>
      <!-- The Card (Captured for Export) -->
      <div
        #cardElement
        id="card-preview"
        class="card"
        [class.aspect-3-4]="aspectRatio() === '3:4'"
        [class.aspect-4-5]="aspectRatio() === '4:5'"
        [class.aspect-1-1]="aspectRatio() === '1:1'"
        [class.aspect-1-91-1]="aspectRatio() === '1.91:1'"
        [class.aspect-9-16]="aspectRatio() === '9:16'"
        [class.aspect-auto]="aspectRatio() === 'auto'"
        [class.no-image]="!backgroundImage()"
      >
        <!-- Background -->
        <div class="card-background">
          @if (backgroundImage()) {
            <img
              [src]="backgroundImage()"
              alt=""
              class="bg-image"
              [class.scale-zoom]="fillMode() === 'cover'"
              [style.object-fit]="fillMode()"
              (load)="onImageLoad($event)"
            />
          }
          <div class="bg-overlay"></div>
        </div>

        <!-- Content -->
        <div class="card-overlay">
          <ng-content select="[fullBleed]"></ng-content>
        </div>

        <div class="card-content">
          <ng-content></ng-content>
        </div>
      </div>
    </div>
    <ng-content select="[viewportOverlay]"></ng-content>
  </div>
</div>
