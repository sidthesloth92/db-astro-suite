<div class="modal-backdrop" (click)="onCancel()">
  <div
    class="modal-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="access-key-modal-title"
    (click)="$event.stopPropagation()"
  >
    @if (view() === 'cta') {
      <div class="modal-header">
        <h2 id="access-key-modal-title" class="modal-title">🔑 WANNA TRY IT OUT?</h2>
      </div>

      <div class="modal-body">
        <p class="modal-description">
          DM @astrowithdb on Instagram to get a key to try it out. Thank You!
        </p>

        <button
          class="modal-btn modal-btn--instagram"
          type="button"
          (click)="openInstagram()"
        >
          📸 DM ON INSTAGRAM
        </button>

        <button class="modal-link" type="button" (click)="switchToKey()">
          Already have a key? ›
        </button>
      </div>

      <div class="modal-footer modal-footer--single">
        <button class="modal-btn modal-btn--cancel" type="button" (click)="onCancel()">
          CLOSE
        </button>
      </div>
    } @else {
      <div class="modal-header">
        <h2 id="access-key-modal-title" class="modal-title">🔑 ENTER ACCESS KEY</h2>
      </div>

      <div class="modal-body">
        <p class="modal-description">Paste the key you received.</p>

        @if (showError()) {
          <p class="modal-error">Invalid access key — please try again</p>
        }

        <dba-ui-input
          label="Access Key"
          placeholder="Enter your access key..."
          type="password"
          [value]="keyValue()"
          (valueChange)="onKeyChange($event)"
        ></dba-ui-input>
      </div>

      <div class="modal-footer">
        <button class="modal-btn modal-btn--cancel" type="button" (click)="switchToCta()">
          BACK
        </button>
        <button
          class="modal-btn modal-btn--submit"
          type="button"
          [disabled]="isSubmitDisabled()"
          (click)="onSubmit()"
        >
          SUBMIT
        </button>
      </div>
    }
  </div>
</div>
