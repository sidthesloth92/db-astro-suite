<dba-ag-base-card-preview
  #base
  [aspectRatio]="cardData().aspectRatio"
  [backgroundImage]="cardData().backgroundImage"
  [author]="cardData().author"
  [exportName]="cardData().title"
  exportTag="info"
  [accentColor]="cardData().accentColor || '#ff2d95'"
  [accentColorRgb]="cardData().accentColorRgb || '255, 45, 149'"
  [secondaryAccentColor]="cardData().secondaryAccentColor || '#00E5FF'"
  [cardOpacity]="cardData().cardOpacity"
  [bleedContent]="true"
  [themeBasisWidth]="activeThemeBasis().width"
  [themeBasisHeight]="activeThemeBasis().height"
>
  <ng-container *ngComponentOutlet="activeThemeComponent()" />
</dba-ag-base-card-preview>
