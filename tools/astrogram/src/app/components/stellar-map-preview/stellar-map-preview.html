<dba-ag-base-card-preview
  #base
  [aspectRatio]="mapData().aspectRatio"
  [backgroundImage]="mapData().backgroundImage"
  fillMode="fill"
  [cardOpacity]="mapData().backgroundImage ? 0 : 0.85"
  [author]="''"
  exportFilename="stellar-map"
>
  @if (mapData().backgroundImage) {
    <div class="toolbar" headerAction>
      <dba-ui-icon-button
        accent="pink"
        [active]="true"
        title="Add annotation"
        [size]="28"
        (clicked)="addCenterAnnotation()"
      >
        <dba-ui-icon-plus [size]="13" />
      </dba-ui-icon-button>
      <!--
        TODO(stellar-select-tool): the Select tool affordance from the
        design ships without a real implementation yet — disable it
        for now so users don't get an inert button with no feedback.
        Hook this up when the marquee / select-modal logic lands.
      -->
      <dba-ui-icon-button
        title="Select mode — coming soon"
        [size]="28"
        [disabled]="true"
        [active]="isSelectToolActive()"
        (clicked)="toggleSelectTool()"
      >
        <dba-ui-icon-target [size]="13" />
      </dba-ui-icon-button>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <dba-ui-pill-badge tone="cyan">{{ visibleCount() }} OBJECTS</dba-ui-pill-badge>
      <button type="button" class="clear-btn" (click)="clearAll()" title="Clear image &amp; data">
        Clear
      </button>
    </div>
  }

  <!-- Absolute layer for annotations -->
  <div
    #annotationsLayer
    class="annotations-layer"
    fullBleed
    [class.is-dragging]="isDragging()"
    (mousemove)="onLayerMousemove($event)"
    (mouseup)="onLayerMouseup($event)"
    (mouseleave)="onLayerMouseleave()"
  >
    @for (ann of visibleAnnotations(); track ann.id) {
      <div
        class="annotation-marker"
        [class.selected]="selectedAnnotationId() === ann.id"
        [style.left.%]="ann.xPercent"
        [style.top.%]="ann.yPercent"
        [ngStyle]="markerStyle(ann)"
        [attr.data-annotation-id]="ann.id"
        (mousedown)="onMarkerMousedown(ann, $event)"
        [title]="ann.label"
      >
        @if (effectiveShowLabel(ann)) {
          <span
            class="annotation-label"
            [ngClass]="getLabelPosition(ann.xPercent, ann.yPercent)"
            [ngStyle]="labelStyle(ann)"
            (mousedown)="onMarkerMousedown(ann, $event)"
          >
            {{ effectiveLabel(ann) }}
            @if (effectiveShowMagnitude(ann) && ann.magnitude !== undefined) {
              <span style="display: block; font-size: 0.85em; opacity: 0.8">
                {{ ann.magnitude | number: '1.1-1' }}
              </span>
            }
          </span>
        }
      </div>
    }
  </div>

  <!-- Upload / solving overlay (handles both empty + solving states) -->
  <dba-ag-stellar-upload-panel #upload viewportOverlay />
</dba-ag-base-card-preview>
