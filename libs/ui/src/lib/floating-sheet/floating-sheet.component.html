<div
  class="sheet"
  [class.is-expanded]="expanded()"
  [style.max-height]="maxHeightPercent() + 'dvh'"
  role="dialog"
  [attr.aria-expanded]="expanded()"
  [attr.aria-label]="title() || null"
>
  <div class="body-wrapper" [attr.aria-hidden]="!expanded() || null">
    <div class="body">
      <div class="header">
        <div class="title">{{ title() }}</div>
        <div class="spacer"></div>
        <div class="header-actions">
          <ng-content select="[slot=header-actions]" />
        </div>
        <button
          type="button"
          class="close"
          aria-label="Collapse panel"
          (click)="collapse()"
        >
          <dba-ui-icon [def]="closeIcon" [size]="14" />
        </button>
      </div>
      <div class="content">
        <ng-content />
      </div>
    </div>
  </div>
  <div class="nav-slot">
    <ng-content select="[slot=nav]" />
  </div>
</div>
