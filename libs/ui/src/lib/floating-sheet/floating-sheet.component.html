<div
  class="sheet"
  [class.is-expanded]="expanded()"
  [style.max-height.%]="expanded() ? maxHeightPercent() : null"
  role="dialog"
  [attr.aria-expanded]="expanded()"
  [attr.aria-label]="title() || null"
>
  @if (expanded()) {
    <div class="body">
      <div class="header">
        <div class="title">{{ title() }}</div>
        <div class="spacer"></div>
        <button
          type="button"
          class="close"
          aria-label="Collapse panel"
          (click)="collapse()"
        >
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </div>
      <div class="content">
        <ng-content />
      </div>
    </div>
  }
  <div class="nav-slot">
    <ng-content select="[slot=nav]" />
  </div>
</div>
