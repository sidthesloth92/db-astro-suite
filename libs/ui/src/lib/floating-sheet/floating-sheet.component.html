<div
  class="sheet"
  [class.is-expanded]="expanded()"
  [style.max-height.%]="expanded() ? maxHeightPercent() : null"
  role="dialog"
  [attr.aria-expanded]="expanded()"
  [attr.aria-label]="title() || null"
>
  @if (expanded()) {
    <div class="body">
      <div class="header">
        <div class="title">{{ title() }}</div>
        <div class="spacer"></div>
        <button
          type="button"
          class="close"
          aria-label="Collapse panel"
          (click)="collapse()"
        >
          <dba-ui-icon-close [size]="14" />
        </button>
      </div>
      <div class="content">
        <ng-content />
      </div>
    </div>
  }
  <div class="nav-slot">
    <ng-content select="[slot=nav]" />
  </div>
</div>
