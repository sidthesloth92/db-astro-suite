<header class="header">
  <a
    class="brand"
    [href]="logoLink() || '/'"
    [attr.aria-label]="title()"
  >
    @if (logoSrc()) {
      <img class="brand-logo" [src]="logoSrc()" [alt]="title() + ' Logo'" />
    }
    <div class="brand-text">
      <div class="brand-title-row">
        <span class="brand-title">{{ title() }}</span>
        @if (version()) {
          <span class="brand-version">v{{ version() }}</span>
        }
      </div>
      @if (tagline() && !isMobile()) {
        <span class="brand-tagline">{{ tagline() }}</span>
      }
    </div>
  </a>

  <div class="center-slot">
    <ng-content select="[slot=center]" />
  </div>

  <div class="actions">
    <a
      class="about-link"
      [href]="aboutLink()"
      target="_blank"
      rel="noopener noreferrer"
    >
      {{ isMobile() ? 'About' : 'About me' }}
    </a>

    @if (githubLink()) {
      <a
        class="github-link"
        [href]="githubLink()"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="View source on GitHub"
      >
        <dba-ui-icon-button title="View source on GitHub" [size]="32" accent="pink">
          <dba-ui-icon-github [size]="14" />
        </dba-ui-icon-button>
      </a>
    }
  </div>
</header>
