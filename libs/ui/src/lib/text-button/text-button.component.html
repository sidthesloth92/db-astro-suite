<!--
  Single source of the projected content. Declaring the [slot=leading] /
  [slot=trailing] ng-content slots once (here) and stamping this template via
  ngTemplateOutlet in each render branch avoids the duplicate-ng-content trap:
  Angular allocates a projection slot per *declared* ng-content, so repeating
  the same selector across @switch branches projects the content into only one
  (the first) branch and drops it everywhere else.
-->
<ng-template #content>
  <ng-content select="[slot=leading]"></ng-content>
  <span class="label">{{ label() }}</span>
  <ng-content select="[slot=trailing]"></ng-content>
</ng-template>

@switch (renderMode()) {
  @case ('router') {
    <a
      class="text-button"
      [routerLink]="routerLink()"
      [attr.data-variant]="variant()"
      [attr.data-size]="size()"
      [attr.data-accent]="accent()"
      [attr.aria-disabled]="disabled() ? 'true' : null"
      [attr.tabindex]="disabled() ? -1 : null"
      (click)="onClick($event)"
    >
      <ng-container [ngTemplateOutlet]="content" />
    </a>
  }
  @case ('href') {
    <a
      class="text-button"
      [attr.href]="href()"
      target="_blank"
      rel="noopener noreferrer"
      [attr.data-variant]="variant()"
      [attr.data-size]="size()"
      [attr.data-accent]="accent()"
      [attr.aria-disabled]="disabled() ? 'true' : null"
      [attr.tabindex]="disabled() ? -1 : null"
      (click)="onClick($event)"
    >
      <ng-container [ngTemplateOutlet]="content" />
    </a>
  }
  @default {
    <button
      type="button"
      class="text-button"
      [attr.data-variant]="variant()"
      [attr.data-size]="size()"
      [attr.data-accent]="accent()"
      [disabled]="disabled()"
      (click)="onClick($event)"
    >
      <ng-container [ngTemplateOutlet]="content" />
    </button>
  }
}
