name: release-deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to build and deploy (e.g. 1.0.0)'
        required: true
        default: 'manual'

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write
  packages: write

# Dedupe CI runs per ref: a new push to a branch/PR cancels that branch's
# in-progress run, but runs on *different* refs never cancel each other.
# (A static group like "pages" here serialised every ref together, so a main
# push could cancel an in-flight PR run and vice-versa.) GitHub Pages deploy
# serialisation lives on the `deploy` job below, not here.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    name: Build & Verify
    # Run on PRs (except release-please PRs), OR on pushes to main THAT ARE NOT release merges
    if: |
      (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(main): release') && !startsWith(github.event.head_commit.message, 'feat(main): release'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Check out the PR head branch (not the GitHub-generated merge ref)
          # so the "Seed visual baselines" step can push commits back to the
          # PR branch. For push events this falls back to the workflow's ref.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
          # Use the classic PAT so seed-step pushes bypass the
          # GITHUB_TOKEN restrictions that return 500 Internal Server Error
          # when an Actions bot tries to push to a PR branch with protections
          # or required status checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build All Applications
        run: pnpm build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        id: playwright
        shell: bash
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee /tmp/playwright-output.log

      # Visual snapshot baselines are intentionally NOT committed locally
      # (rule: .claude/rules/e2e.md — baselines MUST be generated in
      # Linux/Docker so font rendering matches CI's output).
      #
      # This step auto-seeds ONLY when the failure is "snapshot doesn't
      # exist" (i.e. a brand-new visual test added in this PR). If any
      # failure is a visual *diff* — "Screenshot comparison failed" —
      # the step refuses to overwrite, leaving the gate red so the dev
      # makes a conscious decision:
      #   - Intentional UI change? Regenerate locally with the matching
      #     Linux Chromium image and commit the new baselines:
      #         pnpm test:e2e:docker:update <spec>
      #   - Accidental regression? Fix the code instead.
      #
      # This eliminates the original auto-seed's biggest risk — silently
      # baking visual regressions into the baseline.
      - name: Seed missing visual snapshot baselines (PR only, missing-only)
        if: ${{ failure() && steps.playwright.outcome == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -e
          log=/tmp/playwright-output.log
          # Bail when any failure is a real visual diff (not a missing
          # baseline). Auto-overwriting would silently launder regressions.
          if grep -qE "Screenshot comparison failed|expected to have screenshot.*to match" "$log" 2>/dev/null; then
            echo "::error::Visual diff failures detected (not missing baselines)."
            echo "Auto-seed declined to avoid laundering a regression."
            echo "If the change is intentional, regenerate locally and commit:"
            echo "  pnpm test:e2e:docker:update <affected-spec-or-grep>"
            exit 0
          fi
          if ! grep -q "snapshot doesn't exist" "$log" 2>/dev/null; then
            echo "Failures are not snapshot-related; nothing to seed."
            exit 0
          fi
          echo "All visual failures are 'snapshot doesn't exist'; seeding baselines..."
          npx playwright test --update-snapshots --reporter=line || true
          # Snapshot directories live at e2e/<spec>.spec.ts-snapshots/ —
          # use globstar so `**` matches zero-or-more path components.
          shopt -s globstar nullglob
          baselines=(e2e/**/*-snapshots/*.png)
          if [ ${#baselines[@]} -eq 0 ]; then
            echo "No baseline files matched after --update-snapshots."
            exit 0
          fi
          git add "${baselines[@]}"
          if git diff --staged --quiet; then
            echo "No new baselines were generated."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "test(e2e): seed visual baselines from CI"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          echo "Baselines committed and pushed; the next CI run validates them."

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  release-please:
    name: Release Management
    needs: verify
    # Run on EVERY push to main:
    #  - normal commits: `verify` runs first and must succeed; release-please
    #    opens/updates the release PR.
    #  - release-merge commits ("chore(main): release …"): `verify` is skipped
    #    (the content was already verified on the underlying PRs), so we also
    #    accept `skipped` here. Running on this commit is what lets
    #    release-please CREATE the GitHub release + tag for the just-merged
    #    release PR immediately. Previously this job was excluded from release
    #    commits, so the tag was only stamped on the NEXT push to main — and if
    #    no next push ever came, the version was never tagged at all.
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
      # JSON array of released package paths, e.g. ["tools/sortronomy"]. The
      # per-path outputs (tools/sortronomy--release_created) come through empty
      # at the job boundary — the sortronomy-v0.0.1 run created the release yet
      # skipped the gated job — so downstream gates must use this instead.
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      # Runs on the default GITHUB_TOKEN. Side effect: the tags/releases it
      # creates can never trigger `on: push: tags:` workflows (GitHub suppresses
      # triggers for GITHUB_TOKEN-created events), so the sortronomy release job
      # below must live in THIS run, gated on paths_released.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Log release outputs
        run: |
          echo "releases_created=${{ steps.release.outputs.releases_created }}"
          echo "paths_released=${{ steps.release.outputs.paths_released }}"

  release-sortronomy:
    name: Release sortronomy
    needs: release-please
    # Gate on paths_released (a JSON array string like ["tools/sortronomy"]).
    # The slash-named per-path outputs (tools/sortronomy--release_created)
    # evaluate empty at the job boundary — that is why this job never fired for
    # v0.0.1 even though the release was created. Manual re-runs go through
    # sortronomy-release.yml's workflow_dispatch, not this pipeline.
    if: contains(needs.release-please.outputs.paths_released, '"tools/sortronomy"')
    permissions:
      contents: write
    uses: ./.github/workflows/sortronomy-release.yml

  release-celestory:
    name: Release celestory
    needs: release-please
    # Same paths_released gate as sortronomy — the slash-named per-path outputs
    # evaluate empty at the job boundary. Manual re-runs go through
    # celestory-release.yml's workflow_dispatch, not this pipeline.
    if: contains(needs.release-please.outputs.paths_released, '"tools/celestory"')
    permissions:
      contents: write
    uses: ./.github/workflows/celestory-release.yml

  deploy:
    name: Deploy to GitHub Pages
    # Run ONLY on main pushes THAT ARE release merges
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (startsWith(github.event.head_commit.message, 'chore(main): release') || startsWith(github.event.head_commit.message, 'feat(main): release'))
    runs-on: ubuntu-latest
    # Serialise GitHub Pages deployments across refs without cancelling an
    # in-progress deploy (the per-ref workflow concurrency only dedupes CI).
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Unified Suite
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-backend-image:
    name: Build Backend Image
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (startsWith(github.event.head_commit.message, 'chore(main): release') || startsWith(github.event.head_commit.message, 'feat(main): release'))))
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.image.outputs.name }}
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/db-astro-suite-astrosolve" >> "$GITHUB_OUTPUT"

      - name: Compute image tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            version=$(python3 - <<'PY'
          import json
          with open('package.json', 'r', encoding='utf-8') as package_file:
              print(json.load(package_file)['version'])
          PY
            )
            echo "tag=${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./tools/astrosolve/server
          file: ./tools/astrosolve/server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.meta.outputs.tag }}

  deploy-backend:
    name: Deploy Backend
    needs: build-backend-image
    if: |
      always() &&
      needs.build-backend-image.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (startsWith(github.event.head_commit.message, 'chore(main): release') || startsWith(github.event.head_commit.message, 'feat(main): release'))))
    runs-on: ubuntu-latest
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy backend
        run: |
          IMAGE="${{ needs.build-backend-image.outputs.image_name }}:${{ needs.build-backend-image.outputs.image_tag }}"
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" << ENDSSH
            echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            docker pull ${IMAGE}
            docker stop astrosolve || true
            docker rm astrosolve || true
            docker ps -q --filter publish=80 | xargs -r docker stop
            docker ps -aq --filter publish=80 | xargs -r docker rm
            # NOTE: the local catalog is intentionally NOT built here. Building it
            # is slow (a full R-tree rebuild over ~38M rows) and would block the
            # deploy, so it is done out-of-band on the server via
            # scripts/deploy/rebuild-catalog.sh (detached). Deploys stay fast —
            # pull + container swap (~seconds) — and the API mounts whatever
            # catalog already exists (read-only), tolerating its absence on a
            # brand-new server until the first rebuild-catalog.sh run.
            docker run -d \
              --name astrosolve \
              --restart unless-stopped \
              -p 80:3000 \
              -v ${{ vars.APP_DIR }}/data/astrometry:/usr/src/app/data/astrometry:ro \
              -v ${{ vars.APP_DIR }}/data/local-catalog:/usr/src/app/data/local-catalog:ro \
              -v ${{ vars.APP_DIR }}/data/uploads:/usr/src/app/data/uploads \
              -v ${{ vars.APP_DIR }}/data/astrosolve.sqlite:/usr/src/app/data/astrosolve.sqlite \
              -e ASTROSOLVE_ORIGIN="${{ vars.ASTROSOLVE_ORIGIN }}" \
              -e NODE_ENV=production \
              -e TRUST_PROXY=true \
              ${IMAGE}
          ENDSSH
