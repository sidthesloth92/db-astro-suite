name: release-deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to build and deploy (e.g. 1.0.0)'
        required: true
        default: 'manual'

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write
  packages: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  verify:
    name: Build & Verify
    # Run on PRs, OR on pushes to main THAT ARE NOT release merges
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(main): release') && !startsWith(github.event.head_commit.message, 'feat(main): release'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build All Applications
        run: pnpm build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  release-please:
    name: Release Management
    needs: verify
    # Only run on main pushes THAT ARE NOT release merges
    if: |
      always() &&
      needs.verify.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(main): release') &&
      !startsWith(github.event.head_commit.message, 'feat(main): release')
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # Uses the default GITHUB_TOKEN, which gets `contents: write` and
      # `pull-requests: write` from the workflow-level permissions block.
      # Do NOT pass a fine-grained PAT here — fine-grained PATs hit a known
      # "Resource not accessible" error on the create-release endpoint, even
      # with Contents: Read and write set. Tradeoff: the release PR opened
      # by GITHUB_TOKEN does not trigger the `verify` job; that's acceptable
      # because verify has already run on every commit being released, and
      # the release PR only edits CHANGELOG.md and package.json.
      #
      # Uses a classic PAT with full `repo` scope. GITHUB_TOKEN gets silently
      # capped on the create-release endpoint on this repo (returns 403
      # "Resource not accessible by integration" despite the job header showing
      # Contents: write). Classic PATs bypass that cap. Do NOT use a
      # fine-grained PAT here — those hit a separate "Resource not accessible
      # by personal access token" error on release creation, even with
      # Contents: Read and write set.
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        id: release
        with:
          release-type: node
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  deploy:
    name: Deploy to GitHub Pages
    # Run ONLY on main pushes THAT ARE release merges
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (startsWith(github.event.head_commit.message, 'chore(main): release') || startsWith(github.event.head_commit.message, 'feat(main): release'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Unified Suite
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-backend-image:
    name: Build Backend Image
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (startsWith(github.event.head_commit.message, 'chore(main): release') || startsWith(github.event.head_commit.message, 'feat(main): release'))))
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.image.outputs.name }}
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/db-astro-suite-astrosolve" >> "$GITHUB_OUTPUT"

      - name: Compute image tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            version=$(python3 - <<'PY'
          import json
          with open('package.json', 'r', encoding='utf-8') as package_file:
              print(json.load(package_file)['version'])
          PY
            )
            echo "tag=${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./tools/astrosolve/server
          file: ./tools/astrosolve/server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.meta.outputs.tag }}

  deploy-backend:
    name: Deploy Backend
    needs: build-backend-image
    if: |
      always() &&
      needs.build-backend-image.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (startsWith(github.event.head_commit.message, 'chore(main): release') || startsWith(github.event.head_commit.message, 'feat(main): release'))))
    runs-on: ubuntu-latest
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy backend
        run: |
          IMAGE="${{ needs.build-backend-image.outputs.image_name }}:${{ needs.build-backend-image.outputs.image_tag }}"
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" << ENDSSH
            echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            docker pull ${IMAGE}
            docker stop astrosolve || true
            docker rm astrosolve || true
            docker ps -q --filter publish=80 | xargs -r docker stop
            docker ps -aq --filter publish=80 | xargs -r docker rm
            docker run -d \
              --name astrosolve \
              --restart unless-stopped \
              -p 80:3000 \
              -v ${{ vars.APP_DIR }}/data/astrometry:/usr/src/app/data/astrometry:ro \
              -v ${{ vars.APP_DIR }}/data/uploads:/usr/src/app/data/uploads \
              -v ${{ vars.APP_DIR }}/data/astrosolve.sqlite:/usr/src/app/data/astrosolve.sqlite \
              -e ASTROSOLVE_ORIGIN="${{ vars.ASTROSOLVE_ORIGIN }}" \
              -e NODE_ENV=production \
              -e TRUST_PROXY=true \
              ${IMAGE}
          ENDSSH
