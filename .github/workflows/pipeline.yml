name: release-deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to build and deploy (e.g. 1.0.0)'
        required: true
        default: 'manual'

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write
  packages: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  verify:
    name: Build & Verify
    # Run on PRs, OR on pushes to main THAT ARE NOT release merges
    if: |
      github.event_name == 'pull_request' || 
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(main): release'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build All Applications
        run: pnpm build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  release-please:
    name: Release Management
    needs: verify
    # Only run on main pushes THAT ARE NOT release merges
    if: |
      always() &&
      needs.verify.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(main): release')
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # Probe RELEASE_PLEASE_TOKEN before invoking the action so a missing
      # or under-scoped PAT fails here with a clear, actionable message
      # instead of as an opaque "Not Found" deep inside release-please.
      # See .github/RELEASE_PLEASE_PAT.md for required PAT permissions.
      - name: Preflight RELEASE_PLEASE_TOKEN
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN secret is empty or unset."
            echo "::error::See .github/RELEASE_PLEASE_PAT.md to create and store the PAT."
            exit 1
          fi

          PROBE_TAG="release-please-preflight-${{ github.run_id }}"
          BODY="{\"tag_name\":\"$PROBE_TAG\",\"name\":\"release-please preflight (auto-deleted)\",\"draft\":true}"

          HTTP_CODE=$(curl -sS -o /tmp/probe.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "$BODY")

          case "$HTTP_CODE" in
            201)
              RELEASE_ID=$(jq -r '.id' /tmp/probe.json)
              curl -sS -o /dev/null -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID" || \
                echo "::warning::Probe release $RELEASE_ID created but could not be deleted — remove it manually."
              echo "✓ RELEASE_PLEASE_TOKEN has permission to create releases."
              ;;
            401)
              echo "::error::RELEASE_PLEASE_TOKEN is invalid or expired (HTTP 401)."
              echo "::error::Regenerate the PAT per .github/RELEASE_PLEASE_PAT.md."
              exit 1
              ;;
            403|404)
              echo "::error::RELEASE_PLEASE_TOKEN cannot create releases (HTTP $HTTP_CODE)."
              echo "::error::Most likely cause: PAT missing 'Contents: Read and write'."
              echo "::error::See .github/RELEASE_PLEASE_PAT.md for the exact PAT setup."
              cat /tmp/probe.json
              exit 1
              ;;
            *)
              echo "::error::Unexpected response from GitHub releases API (HTTP $HTTP_CODE)."
              cat /tmp/probe.json
              exit 1
              ;;
          esac

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          release-type: node
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  deploy:
    name: Deploy to GitHub Pages
    # Run ONLY on main pushes THAT ARE release merges
    if: |
      always() &&
      github.event_name == 'push' && 
      github.ref == 'refs/heads/main' && 
      startsWith(github.event.head_commit.message, 'chore(main): release')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Unified Suite
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-backend-image:
    name: Build Backend Image
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'chore(main): release')))
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.image.outputs.name }}
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/db-astro-suite-astrosolve" >> "$GITHUB_OUTPUT"

      - name: Compute image tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            version=$(python3 - <<'PY'
          import json
          with open('package.json', 'r', encoding='utf-8') as package_file:
              print(json.load(package_file)['version'])
          PY
            )
            echo "tag=${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./tools/astrosolve/server
          file: ./tools/astrosolve/server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.meta.outputs.tag }}

  deploy-backend:
    name: Deploy Backend
    needs: build-backend-image
    if: |
      always() &&
      needs.build-backend-image.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'chore(main): release')))
    runs-on: ubuntu-latest
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy backend
        run: |
          IMAGE="${{ needs.build-backend-image.outputs.image_name }}:${{ needs.build-backend-image.outputs.image_tag }}"
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" << ENDSSH
            echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            docker pull ${IMAGE}
            docker stop astrosolve || true
            docker rm astrosolve || true
            docker ps -q --filter publish=80 | xargs -r docker stop
            docker ps -aq --filter publish=80 | xargs -r docker rm
            docker run -d \
              --name astrosolve \
              --restart unless-stopped \
              -p 80:3000 \
              -v ${{ vars.APP_DIR }}/data/astrometry:/usr/src/app/data/astrometry:ro \
              -v ${{ vars.APP_DIR }}/data/uploads:/usr/src/app/data/uploads \
              -v ${{ vars.APP_DIR }}/data/astrosolve.sqlite:/usr/src/app/data/astrosolve.sqlite \
              -e ASTROSOLVE_ORIGIN="${{ vars.ASTROSOLVE_ORIGIN }}" \
              -e NODE_ENV=production \
              -e TRUST_PROXY=true \
              ${IMAGE}
          ENDSSH
