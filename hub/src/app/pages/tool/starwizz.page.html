<dba-hub-tool-detail [config]="config" (primaryClicked)="onLaunch()">
  <img mark class="tool-mark" src="assets/img/sw.png" alt="Starwizz logo" />

  <div preview>
    <dba-hub-demo-frame label="starwizz.app" status="Live" [live]="true">
      <img
        class="demo-media"
        src="assets/img/sw_demo.gif"
        alt="Starwizz starfield preview"
      />
    </dba-hub-demo-frame>
  </div>

  <div output>
    <dba-hub-demo-frame label="starwizz.app / render" status="Recording">
      <button
        type="button"
        class="demo-media-btn"
        (click)="openLightbox()"
        aria-label="Expand the starfield output"
      >
        <img
          class="demo-media"
          src="assets/img/sw_demo.gif"
          alt="Starwizz starfield output"
        />
      </button>
    </dba-hub-demo-frame>
  </div>
</dba-hub-tool-detail>

@if (isLightboxOpen()) {
  <div
    class="demo-lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Starfield preview"
    (click)="closeLightbox()"
    (keydown.escape)="closeLightbox()"
    tabindex="-1"
  >
    <button class="demo-lightbox__close" aria-label="Close preview" (click)="closeLightbox()">
      &#x2715;
    </button>
    <img
      src="assets/img/sw_demo.gif"
      alt="Starwizz starfield output"
      class="demo-lightbox__image"
      (click)="$event.stopPropagation()"
    />
  </div>
}
