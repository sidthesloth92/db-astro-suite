<dba-hub-tool-detail [config]="config" (primaryClicked)="onLaunch()">
  <dba-hub-starwizz-mark mark class="tool-mark" [size]="72" [showText]="true" />

  <div preview>
    <dba-hub-demo-frame label="starwizz.app" status="Live" [live]="true">
      <video
        class="demo-media"
        width="1322"
        height="720"
        controls
        playsinline
        preload="metadata"
        poster="assets/img/sw-demo-poster.jpg"
        aria-label="Starwizz cinematic starfield demo"
      >
        <source src="assets/img/sw_demo.mp4" type="video/mp4" />
      </video>
    </dba-hub-demo-frame>
  </div>

  <div output>
    <dba-hub-demo-frame label="starwizz.app" status="Looped">
      <video
        class="demo-media"
        width="1322"
        height="720"
        controls
        playsinline
        preload="metadata"
        poster="assets/img/sw-demo-poster.jpg"
        aria-label="Starwizz cinematic starfield demo"
      >
        <source src="assets/img/sw_demo.mp4" type="video/mp4" />
      </video>
    </dba-hub-demo-frame>
  </div>
</dba-hub-tool-detail>
