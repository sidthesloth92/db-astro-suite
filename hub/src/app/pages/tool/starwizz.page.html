<dba-hub-tool-detail [config]="config" (primaryClicked)="onLaunch()">
  <dba-hub-starwizz-mark mark class="tool-mark" [size]="72" [showText]="true" />

  <div preview>
    <dba-hub-demo-frame label="starwizz.app" status="Live" [live]="true">
      <img
        class="demo-media"
        src="assets/img/sw_demo.gif"
        alt="Starwizz starfield preview"
      />
    </dba-hub-demo-frame>
  </div>

  <div output>
    <!-- TODO(demo): placeholder reuses sw_demo.gif; swap in a captured Custom Path (A→B) clip when ready. -->
    <dba-hub-demo-frame label="starwizz.app / custom path" status="A→B">
      <button
        type="button"
        class="demo-media-btn"
        (click)="openLightbox()"
        aria-label="Expand the custom camera path output"
      >
        <img
          class="demo-media"
          src="assets/img/sw_demo.gif"
          alt="Starwizz custom A→B camera path output"
        />
      </button>
    </dba-hub-demo-frame>
  </div>
</dba-hub-tool-detail>

@if (isLightboxOpen()) {
  <div
    class="demo-lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Custom camera path preview"
    (click)="closeLightbox()"
    (keydown.escape)="closeLightbox()"
    tabindex="-1"
  >
    <button class="demo-lightbox__close" aria-label="Close preview" (click)="closeLightbox()">
      &#x2715;
    </button>
    <img
      src="assets/img/sw_demo.gif"
      alt="Starwizz custom A→B camera path output"
      class="demo-lightbox__image"
      (click)="$event.stopPropagation()"
    />
  </div>
}
