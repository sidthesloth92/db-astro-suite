<dba-hub-tool-detail [config]="config" (primaryClicked)="onLaunch()">
  <img mark class="tool-mark" src="assets/img/astrospike.png" alt="AstroSpike logo" />

  <div preview>
    <dba-hub-demo-frame label="astrospike.app / walkthrough" status="Demo">
      <video
        class="demo-media"
        width="1920"
        height="1080"
        controls
        playsinline
        preload="metadata"
        poster="assets/img/astrospike-demo-poster.jpg"
        aria-label="AstroSpike walkthrough demo: tuning star magnitude, spike length, glow and brightness, removing and adding stars by hand, switching presets and arm counts, applying the Diffusion glow and Mist haze, and exporting the spiked photo"
      >
        <source src="assets/img/astrospike-demo-desktop-compressed.mp4" type="video/mp4" />
      </video>
    </dba-hub-demo-frame>
  </div>

  <div output>
    <div class="output-pair">
      <figure class="output-pair__item">
        <h3 class="output-pair__title">
          <span class="output-pair__title-accent">Before</span>
        </h3>
        <dba-hub-demo-frame label="astrospike.app / original">
          <img
            class="demo-media"
            src="assets/img/astrospike-before.jpg"
            alt="The original astrophoto before any spikes were added"
          />
        </dba-hub-demo-frame>
      </figure>

      <figure class="output-pair__item">
        <h3 class="output-pair__title">
          <span class="output-pair__title-accent">After</span>
        </h3>
        <dba-hub-demo-frame label="astrospike.app / spiked" status="Exported">
          <img
            class="demo-media"
            src="assets/img/astrospike-after.jpg"
            alt="The same astrophoto exported with brightness-scaled diffraction spikes"
          />
        </dba-hub-demo-frame>
      </figure>
    </div>
  </div>
</dba-hub-tool-detail>
