<dba-hub-tool-detail [config]="config" (primaryClicked)="onLaunch()">
  <dba-hub-astro-mark mark class="tool-mark" [size]="72" />

  <div preview>
    <dba-hub-demo-frame
      label="astrogram.app / stellar map"
      status="Solved"
      [live]="true"
    >
      <img
        class="demo-media"
        src="assets/img/astrogram-demo.gif"
        alt="Astrogram plate-solved Stellar Map with labelled objects and light-year distances"
      />
    </dba-hub-demo-frame>
  </div>

  <div output>
    <div class="output-pair">
      <figure class="output-pair__item">
        <h3 class="output-pair__title">
          <span class="output-pair__title-accent">Plate</span> Solving
        </h3>
        <dba-hub-demo-frame label="astrogram.app / annotated">
          <button
            type="button"
            class="demo-media-btn"
            (click)="
              openLightbox(
                'assets/img/astrogram-platesolve-example.jpg',
                'Astrogram plate-solved annotated image with labelled objects and light-year distances'
              )
            "
            aria-label="Expand the plate-solved annotated image"
          >
            <img
              class="demo-media"
              src="assets/img/astrogram-platesolve-example.jpg"
              alt="Astrogram plate-solved annotated image with labelled objects and light-year distances"
            />
          </button>
        </dba-hub-demo-frame>
      </figure>

      <figure class="output-pair__item">
        <h3 class="output-pair__title">
          <span class="output-pair__title-accent">Info</span>graphic
        </h3>
        <dba-hub-demo-frame label="astrogram.app / card">
          <button
            type="button"
            class="demo-media-btn"
            (click)="
              openLightbox(
                'assets/img/astrogram-infographic-example.jpg',
                'Astrogram infographic exposure card output'
              )
            "
            aria-label="Expand the infographic exposure card"
          >
            <img
              class="demo-media"
              src="assets/img/astrogram-infographic-example.jpg"
              alt="Astrogram infographic exposure card output"
            />
          </button>
        </dba-hub-demo-frame>
      </figure>
    </div>
  </div>
</dba-hub-tool-detail>

@if (isLightboxOpen()) {
<div
  class="demo-lightbox"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="lightboxAlt()"
  (click)="closeLightbox()"
  (keydown.escape)="closeLightbox()"
  tabindex="-1"
>
  <button
    class="demo-lightbox__close"
    aria-label="Close preview"
    (click)="closeLightbox()"
  >
    &#x2715;
  </button>
  <img
    [src]="lightboxSrc()"
    [alt]="lightboxAlt()"
    class="demo-lightbox__image"
    (click)="$event.stopPropagation()"
  />
</div>
}
