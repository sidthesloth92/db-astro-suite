<dba-hub-tool-detail [config]="config" (primaryClicked)="onLaunch()">
  <img mark class="tool-mark" src="assets/img/astrogram.png" alt="Astrogram logo" />

  <div preview>
    <dba-hub-demo-frame label="astrogram.app" status="Preview" [live]="true">
      <img
        class="demo-media"
        src="assets/img/astrogram_demo.jpg"
        alt="Astrogram exposure card sample"
      />
    </dba-hub-demo-frame>
  </div>

  <div output>
    <dba-hub-demo-frame label="astrogram.app / export" status="JPEG">
      <button
        type="button"
        class="demo-media-btn"
        (click)="openLightbox()"
        aria-label="Expand the exposure card output"
      >
        <img
          class="demo-media"
          src="assets/img/astrogram_demo.jpg"
          alt="Astrogram exposure card output"
        />
      </button>
    </dba-hub-demo-frame>
  </div>
</dba-hub-tool-detail>

@if (isLightboxOpen()) {
  <div
    class="demo-lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Exposure card preview"
    (click)="closeLightbox()"
    (keydown.escape)="closeLightbox()"
    tabindex="-1"
  >
    <button class="demo-lightbox__close" aria-label="Close preview" (click)="closeLightbox()">
      &#x2715;
    </button>
    <img
      src="assets/img/astrogram_demo.jpg"
      alt="Astrogram exposure card output"
      class="demo-lightbox__image"
      (click)="$event.stopPropagation()"
    />
  </div>
}
